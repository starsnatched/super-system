[project]
name = "super-system"
version = "0.1.0"
description = "Multi-agent software engineering team powered by Claude"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.37",
    "httpx>=0.27",
    "rich>=13.9",
    "textual>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
super-system = "super_system.cli:main"
super-system-server = "super_system.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
